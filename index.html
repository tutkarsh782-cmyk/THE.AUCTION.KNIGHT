function statBox(p){if(p.coach)return'';
 const pill=(t,c)=>`<div class="st"><span class="chip" style="background:${c||'#ffffff12'};padding:5px 12px;border-radius:99px">${t}</span></div>`;
 if(UNS[p.n])return pill('🚫 IPL 2026: '+UNS[p.n],'#e5393555');
 if(RET.includes(p.n))return pill('🏛 Retired legend · did not play IPL 2026');
 const s=ST[p.n],tm=TEAM[p.n];
 if(!s)return pill(tm?'🏏 IPL 2026 · '+tm+' · season stat line not loaded':'📊 IPL 2026 status not verified');
 const bx=(k,v)=>v==null?'':`<div class="sx"><b>${v}</b><span>${k}</span></div>`;let h='';
 if(s.b&&p.r!='W')h+=bx('Runs',s.b[1])+bx('Avg',s.b[3])+bx('SR',s.b[4])+bx('HS',s.b[2]);
 if(s.w&&p.r!='B')h+=bx('Wickets',s.w[1])+bx('Econ',s.w[3])+bx('Best',s.w[2]);
 h+=bx('Matches',(s.b&&s.b[0])||(s.w&&s.w[0]));
 return`<div class="st"><div class="chip">📊 IPL 2026 · ${tm||''} · ${p.r=='A'?'all-rounder':p.r=='W'?'bowling':'batting'}</div><div class="sg">${h}</div></div>`}

function loadPic(p){if(PICS[p.n]){p.pic=PICS[p.n];return}if('pic' in p)return;p.pic='';
 fetch('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(p.n+' cricketer')+'&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=240&format=json&origin=*').then(r=>r.json()).then(j=>{
  const pg=j.query&&Object.values(j.query.pages)[0],u=pg&&pg.thumbnail&&pg.thumbnail.source;
  if(u){p.pic=u;const e=document.getElementById('avp');if(e&&G&&G.cur===p)e.innerHTML='<img src="'+u+'" alt="">'}}).catch(()=>{})}
function capUI(t,ti){const o=k=>`<select ${mine(ti)?'':'disabled'} onchange="setCap(${ti},'${k}',this.value)"><option value="">— ${k=='cap'?'Captain':'Vice-captain'} —</option>${t.all.map(x=>`<option ${t[k]==x.n?'selected':''}>${x.n}</option>`).join('')}</select>`;
 return`<div class="chip" style="margin:8px 0 2px">👑 Captain &amp; Vice-captain</div><div style="display:flex;gap:6px">${o('cap')}${o('vc')}</div>`}
function setCap(ti,k,v){saveU();const t=G.teams[ti],o=k=='cap'?'vc':'cap';if(v&&t[o]==v)G.msg='Captain and vice-captain must be different players';else t[k]=v;renderEnd()}
document.head.insertAdjacentHTML('beforeend','<style>.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}.cb{background:var(--gold);color:#111;border-radius:6px;padding:0 4px;font-size:10px;margin-left:3px;font-weight:800}</style>');
const LBL={1:'OPENERS',3:'TOP ORDER',5:'MIDDLE ORDER',8:'LOWER ORDER / TAIL'};
const nmf=(x,t)=>(x.wk?'🧤':'')+(x.b>=7?'⭐':'')+x.n+(t&&t.cap==x.n?'<b class="cb">C</b>':'')+(t&&t.vc==x.n?'<b class="cb">VC</b>':'');
function slots(t,p){let h='<div class="tl">';
 for(let i=1;i<=11;i++){const a=t.r[i],hit=p&&!p.coach&&opts(p).includes(i);
  if(LBL[i])h+=`<div class="sec">${LBL[i]}</div>`;
  h+=`<div class="row ${a.length?'f':''} ${hit&&a.length>=2?'full':hit?'can':''}"><div class="bn">${i}</div><div class="nmx">${a.length?a.map(x=>`<div>${nmf(x,t)} <i>$${x.price}</i></div>`).join(''):'<em>open</em>'}</div></div>`}
 h+=`</div><div class="box"><div class="bt">${FIN()?'🪑 Extras':'🌍 Overseas extras'} <span>${FIN()?t.bench.length:t.bench.length+'/2'}</span></div>${t.bench.length?t.bench.map(x=>`<div class="bx">${x.n} <i>$${x.price}</i></div>`).join(''):'<em>empty</em>'}</div>`;
 h+=`<div class="box coach"><div class="bt">🧢 Coach</div>${t.coach?`<div class="bx">${t.coach.n} <i>$${t.coach.price}</i></div>`:'<em>not bought</em>'}</div>`;
 return h}
function render(){
 const p=G.cur,c=p.coach,bc=G.bidder?(G.bidder.col=='#262626'?'#fff':G.bidder.col):'';
 $('app').innerHTML=`<div class="top"><h1 style="font-size:26px">♞ THE AUCTION KNIGHT</h1><span class="chip">${c?'🧢 Coaches':'Players'} · #${G.seen} of ${G.total} · Sold ${G.sold}${G.round2?' · 🔁 Unsold round':''}</span></div>
 <div class="stage"><div class="card pl"><div class="chip">NOW ON THE BLOCK</div><div class="ph">${av(p)}<div class="nm">${p.n}</div></div>
 <div class="tags"><span class="tag">${FL[p.c]}</span><span class="tag">${c?'🧢 Coach':RL[p.r]}</span>${p.wk?'<span class="tag">🧤 Wicketkeeper</span>':''}${p.u?'<span class="tag" style="background:#2e7d32">🌱 Uncapped</span>':''}<span class="tag">Base $${p.b}</span>${p.b>=7&&!c?'<span class="tag" style="background:var(--gold);color:#111">⭐ Marquee</span>':''}</div>
 ${statBox(p)}<div>${c?'Currently with <span class="pos">'+p.note+'</span>':'Role: <span class="pos">'+posLbl(p)+'</span>'}</div>
 <div class="timer" id="tm">${Math.ceil((G.dl-Date.now())/1000)}</div><div class="bar"><i id="bf" style="width:100%"></i></div>
 <div class="bid">${G.bidder?`Current bid <b>$${G.bid}</b> by <span style="color:${bc};font-weight:800">${G.bidder.name}</span>`:'No bids yet · starts at <b>$'+p.b+'</b>'}</div>
 <div style="margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${HO()?`<button class="btn" style="background:#43a047;color:#fff" ${G.bidder?'':'disabled'} onclick="forceSell()">🔨 SOLD</button><button class="btn" style="background:#e53935;color:#fff" ${G.bidder?'disabled':''} onclick="forceSell()">⏭ UNSOLD</button><button class="btn" style="background:#6d4c41;color:#fff" ${U?'':'disabled'} onclick="undoMove()">↩ Undo</button>`:''}</div></div></div>
 <div class="teams">${G.teams.map((t,i)=>`<div class="card team t-${t.cls} ${G.bidder===t?'lead':''}" style="--c:${t.col}"><h3><span>${t.name}${seatTag(i)}</span><span class="purse">$${t.purse}</span></h3>
 ${meters(t)}
 <button class="btn" ${canBid(t)&&mine(i)?'':'disabled'} onclick="bid(${i})">${!mine(i)?'👀 Opponent':canBid(t)?'BID $'+nb():why(t,p)}</button>${lockBtn(t,i)}${tradeBtn(t,i)}
 <div class="slots">${slots(t,p)}</div></div>`).join('')}</div>
 <div class="center" style="margin:24px">${HO()?'<button class="btn" id="eb" style="background:#444;color:#fff" onclick="endAsk()">⛔ End the bidding</button>':''}</div>`}
function endAsk(){const b=$('eb');if(eAsk){end();return}eAsk=1;b.textContent='⚠ Tap again to confirm';b.style.background='#c62828';setTimeout(()=>{eAsk=0;const x=$('eb');if(x){x.textContent='⛔ End the bidding';x.style.background='#444'}},4000)}
function end(){G.phase='over';$('ov').className='ov';$('md').className='ov';eAsk=0;finalize();U=null;renderEnd()}
/* ---- final shuffle ---- */

window.ckBsw=function(ti,_,nv){const t=G.teams[ti],a=String(nv).split('|'),n=a[0],v=a[1];let p=null,cur=0;
